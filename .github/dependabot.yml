version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Rome
    open-pull-requests-limit: 10
    groups:
      composer-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:30'
      timezone: Europe/Rome
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - '*'
