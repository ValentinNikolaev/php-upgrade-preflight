name: Bug report
description: Report a reproducible problem.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Remove credentials, private source code, and other sensitive information before submitting. Pull requests with a fix are also welcome — see the [contribution policy](https://github.com/ValentinNikolaev/php-upgrade-preflight/blob/main/CONTRIBUTING.md).

        Report security vulnerabilities privately through the [repository security policy](https://github.com/ValentinNikolaev/php-upgrade-preflight/blob/main/SECURITY.md) instead of this form.
  - type: input
    id: version
    attributes:
      label: Version
      description: Which PHP Upgrade Preflight version produced the problem?
      placeholder: 0.2.1
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system and PHP and Composer versions.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reproducible sequence without confidential project data.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Add relevant output after removing credentials, private URLs, absolute paths, and proprietary source code.
      render: shell
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      options:
        - label: I have searched existing issues for the same problem.
          required: true
        - label: I have removed credentials, private source code, vulnerability details, and other sensitive information.
          required: true
        - label: I understand that this issue does not authorize an external code contribution.
          required: true
