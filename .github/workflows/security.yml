name: Dependency security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Composer vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP 8.0
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Install locked dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3
        with:
          composer-options: --prefer-dist --no-progress

      - name: Block vulnerable locked dependencies
        run: composer audit --locked --no-interaction --no-ansi
