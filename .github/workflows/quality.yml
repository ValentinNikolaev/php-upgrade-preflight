name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: PHP 8.0 quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Cache Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --prefer-dist --no-progress

      - name: Validate Composer manifests
        run: composer validate --strict && composer validate --strict packages/core/composer.json && composer validate --strict packages/cli/composer.json && composer validate --strict packages/laravel/composer.json

      - name: Run quality checks
        run: composer check
