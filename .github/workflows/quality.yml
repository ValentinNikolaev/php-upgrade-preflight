name: Quality

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Supersede in-flight pull request runs only. Release calls this workflow through
# workflow_call, where github.event_name resolves to the caller's push event, so a
# tagged release run is never cancelled by a later commit.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static-analysis:
    name: Static analysis / PHP 8.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        shell: bash
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

      - name: Set up PHP 8.0
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Mask synthetic secret canaries
        run: php tools/mask-secret-canaries.php

      - name: Cache Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v3
        with:
          composer-options: --prefer-dist --no-progress

      # PHPStan keeps one resultCache.php per tmpDir, so the two configurations use
      # separate directories and neither pass clobbers the other. The run-scoped key
      # suffix makes every run publish a fresh entry instead of going stale on a hit.
      - name: Restore static analysis result caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/phpstan
            .php-cs-fixer.cache
          key: static-analysis-php8.0-${{ hashFiles('composer.lock', 'phpstan.neon.dist', 'phpstan-production.neon.dist', 'phpstan-production-baseline.neon', '.php-cs-fixer.dist.php') }}-${{ github.run_id }}
          restore-keys: |
            static-analysis-php8.0-${{ hashFiles('composer.lock', 'phpstan.neon.dist', 'phpstan-production.neon.dist', 'phpstan-production-baseline.neon', '.php-cs-fixer.dist.php') }}-
            static-analysis-php8.0-

      - name: Validate manifests and run static checks
        shell: bash
        run: |
          composer validate:all
          composer analyse
          composer lint

  coverage:
    name: Coverage ratchet / PHP 8.3
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.3 with PCOV
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: pcov
          extensions: zip

      - name: Mask synthetic secret canaries
        run: php tools/mask-secret-canaries.php

      - name: Cache Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v3
        with:
          composer-options: --prefer-dist --no-progress

      - name: Measure and verify coverage
        run: composer test:coverage

      - name: Run selective mutation gate
        run: composer test:mutation

  quality:
    name: ${{ matrix.os }} / PHP ${{ matrix.php }} / ${{ matrix.suite }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            php: '8.0'
            suite: all
            test_command: composer test
            privacy: true
          - os: ubuntu-latest
            php: '8.1'
            suite: all
            test_command: composer test
            privacy: true
          - os: ubuntu-latest
            php: '8.2'
            suite: all
            test_command: composer test
            privacy: true
          - os: ubuntu-latest
            php: '8.3'
            suite: all
            test_command: composer test
            privacy: true
          - os: ubuntu-latest
            php: '8.4'
            suite: all
            test_command: composer test
            privacy: true
          - os: ubuntu-latest
            php: '8.5'
            suite: all
            test_command: composer test
            privacy: true
          - os: windows-latest
            php: '8.3'
            suite: unit-smoke
            test_command: composer test:unit-smoke
            privacy: true
          - os: windows-latest
            php: '8.3'
            suite: parity-a
            test_command: composer test:integration:windows-parity-a
            privacy: false
          - os: windows-latest
            php: '8.3'
            suite: parity-b
            test_command: composer test:integration:windows-parity-b
            privacy: false
          - os: windows-latest
            php: '8.3'
            suite: integration-heavy
            test_command: composer test:integration:windows-heavy
            privacy: false
          - os: windows-latest
            php: '8.3'
            suite: integration-rest
            test_command: composer test:integration:windows-rest
            privacy: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: zip

      - name: Mask synthetic secret canaries
        run: php tools/mask-secret-canaries.php

      - name: Cache Composer dependencies
        if: runner.os != 'Windows'
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v3
        with:
          composer-options: --prefer-dist --no-progress

      - name: Install Composer dependencies on Windows
        if: runner.os == 'Windows'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run test suite
        run: ${{ matrix.test_command }}

      - name: Verify report privacy
        if: matrix.privacy
        run: php tools/verify-report-privacy.php

  staged-budgets:
    name: Worst supported staged chain / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Mask synthetic secret canaries
        run: php tools/mask-secret-canaries.php

      - name: Cache Composer dependencies
        if: runner.os != 'Windows'
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v3
        with:
          composer-options: --prefer-dist --no-progress

      - name: Install Composer dependencies on Windows
        if: runner.os == 'Windows'
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Enforce worst-chain process, runtime, memory, privacy, size, and determinism budgets
        run: composer test:integration:staged-budget
