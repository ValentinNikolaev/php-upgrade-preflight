name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / PHP ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            php: '8.0'
          - os: ubuntu-latest
            php: '8.1'
          - os: ubuntu-latest
            php: '8.2'
          - os: ubuntu-latest
            php: '8.3'
          - os: ubuntu-latest
            php: '8.4'
          - os: ubuntu-latest
            php: '8.5'
          - os: windows-latest
            php: '8.3'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Cache Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --prefer-dist --no-progress

      - name: Run full quality suite
        run: composer check
