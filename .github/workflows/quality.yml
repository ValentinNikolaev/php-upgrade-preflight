name: Quality

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run actionlint
        shell: bash
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  quality:
    name: ${{ matrix.os }} / PHP ${{ matrix.php }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            php: '8.0'
          - os: ubuntu-latest
            php: '8.1'
          - os: ubuntu-latest
            php: '8.2'
          - os: ubuntu-latest
            php: '8.3'
          - os: ubuntu-latest
            php: '8.4'
          - os: ubuntu-latest
            php: '8.5'
          - os: windows-latest
            php: '8.3'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Mask synthetic secret canaries
        shell: pwsh
        run: |
          $fixture = Get-Content -LiteralPath 'tests/fixtures/security/composer-output-with-secrets.json' -Raw | ConvertFrom-Json
          foreach ($canary in $fixture.canaries.PSObject.Properties) {
            $value = [string] $canary.Value
            if ([string]::IsNullOrEmpty($value)) {
              throw "Synthetic secret canary $($canary.Name) is empty."
            }
            Write-Output "::add-mask::$value"
          }

      - name: Cache Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: --prefer-dist --no-progress

      - name: Run full quality suite
        run: composer check
