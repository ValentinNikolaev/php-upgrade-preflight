name: Compatibility smoke

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  installability:
    name: ${{ matrix.case.name }} / ${{ matrix.resolution }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution:
          - normal
          - lowest
        # slug is a cache-key-safe identity for the case. It must stay unique across
        # the matrix, because two cases can share the same PHP version and smoke kind.
        case:
          - name: core / PHP 8.0
            slug: core-php80
            php: '8.0'
            package: php-upgrade-preflight/core:@dev
            framework: ''
            smoke: core
          - name: CLI / PHP 8.0
            slug: cli-php80
            php: '8.0'
            package: php-upgrade-preflight/cli:@dev
            framework: ''
            smoke: cli
          - name: Laravel 8 / PHP 8.0
            slug: laravel8-php80
            php: '8.0'
            package: php-upgrade-preflight/laravel:@dev
            framework: laravel/framework:^8.0
            smoke: laravel
          - name: Laravel 9 / PHP 8.0
            slug: laravel9-php80
            php: '8.0'
            package: php-upgrade-preflight/laravel:@dev
            framework: laravel/framework:^9.0
            smoke: laravel
          - name: Laravel 10 / PHP 8.1
            slug: laravel10-php81
            php: '8.1'
            package: php-upgrade-preflight/laravel:@dev
            framework: laravel/framework:^10.0
            smoke: laravel
          - name: Laravel 11 / PHP 8.2
            slug: laravel11-php82
            php: '8.2'
            package: php-upgrade-preflight/laravel:@dev
            framework: laravel/framework:^11.0
            smoke: laravel
          - name: Laravel 12 / PHP 8.2
            slug: laravel12-php82
            php: '8.2'
            package: php-upgrade-preflight/laravel:@dev
            framework: laravel/framework:^12.0
            smoke: laravel
          - name: Laravel 13 / PHP 8.3
            slug: laravel13-php83
            php: '8.3'
            package: php-upgrade-preflight/laravel:@dev
            framework: laravel/framework:^13.0
            smoke: laravel
          - name: Laravel 13 current / PHP 8.3
            slug: laravel13-current-php83
            php: '8.3'
            package: php-upgrade-preflight/laravel:@dev
            framework: laravel/framework:^13.35
            smoke: laravel
          - name: Illuminate 13 current / PHP 8.3
            slug: illuminate13-current-php83
            php: '8.3'
            package: php-upgrade-preflight/laravel:@dev
            framework: illuminate/console:^13.35
            smoke: illuminate
          - name: core current dependencies / PHP 8.5
            slug: core-current-php85
            php: '8.5'
            package: php-upgrade-preflight/core:@dev
            framework: ''
            dependencies: composer/semver:^3.5 nikic/php-parser:^5.9 symfony/filesystem:^8.1 symfony/process:^8.1
            smoke: core
          - name: CLI current / PHP 8.5
            slug: cli-current-php85
            php: '8.5'
            package: php-upgrade-preflight/cli:@dev
            framework: ''
            smoke: cli
          - name: Laravel 13 / PHPUnit 13 / PHP 8.5
            slug: laravel13-phpunit13-php85
            php: '8.5'
            package: php-upgrade-preflight/laravel:@dev
            framework: laravel/framework:^13.35
            dependencies: phpunit/phpunit:^13.4
            test_tool: phpunit
            smoke: laravel
          - name: Laravel 13 / Pest 5 / PHP 8.5
            slug: laravel13-pest5-php85
            php: '8.5'
            package: php-upgrade-preflight/laravel:@dev
            framework: laravel/framework:^13.35
            dependencies: pestphp/pest:^5.3 pestphp/pest-plugin-laravel:^5.0
            test_tool: pest
            smoke: laravel
          - name: Illuminate 13 / Symfony 8.1 / PHP 8.5
            slug: illuminate13-symfony81-php85
            php: '8.5'
            package: php-upgrade-preflight/laravel:@dev
            framework: illuminate/console:^13.35
            dependencies: symfony/console:^8.1 symfony/process:^8.1
            smoke: illuminate
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.case.php }}
          coverage: none
          tools: composer:v2

      # Cache only Composer's downloaded archives, never its Packagist metadata cache.
      # Resolution still runs against live metadata on every job, so this smoke test
      # keeps detecting ecosystem drift; only the repeated zip downloads are reused.
      - name: Resolve the Composer download cache directory
        shell: bash
        run: echo "COMPOSER_FILES_CACHE=$(composer config --global --absolute cache-files-dir)" >> "${GITHUB_ENV}"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.COMPOSER_FILES_CACHE }}
          key: compat-${{ matrix.case.slug }}-${{ matrix.resolution }}-${{ github.run_id }}
          restore-keys: compat-${{ matrix.case.slug }}-${{ matrix.resolution }}-

      - name: Resolve a clean consumer install
        shell: bash
        env:
          PACKAGE: ${{ matrix.case.package }}
          FRAMEWORK: ${{ matrix.case.framework }}
          RESOLUTION: ${{ matrix.resolution }}
          SMOKE: ${{ matrix.case.smoke }}
          DEPENDENCIES: ${{ matrix.case.dependencies }}
          TEST_TOOL: ${{ matrix.case.test_tool }}
        run: |
          set -euo pipefail
          install_dir="${RUNNER_TEMP}/consumer install"
          mkdir -p "${install_dir}"
          cd "${install_dir}"

          export COMPOSER_ROOT_VERSION=1.0.0
          composer init \
            --no-interaction \
            --name=php-upgrade-preflight/compatibility-smoke \
            --description='Ephemeral compatibility smoke test' \
            --license=proprietary
          composer config minimum-stability dev
          composer config prefer-stable true
          if [[ "${TEST_TOOL}" == 'pest' ]]; then
            composer config allow-plugins.pestphp/pest-plugin true
          fi
          composer config repositories.core \
            "{\"type\":\"path\",\"url\":\"${GITHUB_WORKSPACE}/packages/core\",\"options\":{\"versions\":{\"php-upgrade-preflight/core\":\"0.3.x-dev\"}}}"
          composer config repositories.cli \
            "{\"type\":\"path\",\"url\":\"${GITHUB_WORKSPACE}/packages/cli\",\"options\":{\"versions\":{\"php-upgrade-preflight/cli\":\"0.3.x-dev\"}}}"
          composer config repositories.laravel \
            "{\"type\":\"path\",\"url\":\"${GITHUB_WORKSPACE}/packages/laravel\",\"options\":{\"versions\":{\"php-upgrade-preflight/laravel\":\"0.3.x-dev\"}}}"

          if [[ "${SMOKE}" == 'laravel' ]]; then
            cp -R "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/app" .
            cp -R "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/bootstrap" .
            cp -R "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/config" .
            cp -R "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/tests" .
            cp "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/artisan" .
            mkdir -p storage/logs bootstrap/cache

            # PHP variables are intentionally single-quoted from Bash.
            # shellcheck disable=SC2016
            php -r '
              $manifest = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
              $fixture = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
              if (($manifest["require"] ?? null) === []) {
                  unset($manifest["require"]);
              }
              $manifest["autoload"] = $fixture["autoload"];
              $manifest["scripts"] = $fixture["scripts"];
              file_put_contents(
                  "composer.json",
                  json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . "\n"
              );
            ' "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/composer.json"
          fi

          resolution_options=()
          if [[ "${RESOLUTION}" == 'lowest' ]]; then
            resolution_options+=(--prefer-lowest)
          fi

          requirements=("${PACKAGE}")
          if [[ -n "${FRAMEWORK}" ]]; then
            requirements+=("${FRAMEWORK}")
          fi
          if [[ "${SMOKE}" == 'illuminate' ]]; then
            requirements+=('illuminate/container:^13.35' 'illuminate/support:^13.35')
          fi
          if [[ -n "${DEPENDENCIES}" ]]; then
            read -r -a extra_requirements <<< "${DEPENDENCIES}"
            requirements+=("${extra_requirements[@]}")
          fi

          composer require \
            --no-interaction \
            --no-progress \
            --no-security-blocking \
            "${resolution_options[@]}" \
            "${requirements[@]}"
          composer check-platform-reqs --no-dev

      - name: Smoke-test installed package
        shell: bash
        env:
          SMOKE: ${{ matrix.case.smoke }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/consumer install"

          case "${SMOKE}" in
            core)
              php -r "require 'vendor/autoload.php'; exit(interface_exists(PhpUpgradePreflight\\Core\\Contracts\\UpgradeAnalyzer::class) ? 0 : 1);"
              ;;
            cli)
              vendor/bin/upgrade-intel --help
              ;;
            laravel)
              php tests/smoke.php
              ;;
            illuminate)
              # PHP variables are intentionally single-quoted from Bash.
              # shellcheck disable=SC2016
              php -r '
                require "vendor/autoload.php";
                $container = new Illuminate\Container\Container();
                $container->instance(
                    PhpUpgradePreflight\Core\Contracts\UpgradeAnalyzer::class,
                    new PhpUpgradePreflight\Core\Analysis\DefaultUpgradeAnalyzer([
                        new PhpUpgradePreflight\Laravel\LaravelFrameworkIntegration(),
                    ])
                );
                $command = $container->make(PhpUpgradePreflight\Laravel\Commands\AnalyzeUpgradeCommand::class);
                exit($command->getName() === "upgrade:analyze" && $command->getDefinition()->hasOption("target") ? 0 : 1);
              '
              ;;
          esac

      - name: Exercise current test tools with the installed analyzer
        if: matrix.case.test_tool != ''
        shell: bash
        env:
          TEST_TOOL: ${{ matrix.case.test_tool }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/consumer install"
          case "${TEST_TOOL}" in
            phpunit)
              vendor/bin/phpunit --no-configuration --bootstrap vendor/autoload.php \
                "${GITHUB_WORKSPACE}/tests/fixtures/current-test-tools/PhpunitSmokeTest.php"
              ;;
            pest)
              cp "${GITHUB_WORKSPACE}/tests/fixtures/current-test-tools/ConsumerUpgrade.php" tests/ConsumerUpgrade.php
              cp "${GITHUB_WORKSPACE}/tests/fixtures/current-test-tools/PestSmokeTest.php" tests/PestSmokeTest.php
              vendor/bin/pest --no-configuration --bootstrap vendor/autoload.php tests/PestSmokeTest.php
              ;;
          esac

      - name: Remove temporary consumer
        if: always()
        shell: bash
        run: rm -rf -- "${RUNNER_TEMP}/consumer install"
