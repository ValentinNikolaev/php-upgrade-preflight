name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Exact v0.3 release version to verify and package without publishing
        required: true
        default: 0.3.0
        type: string
  workflow_call:
    inputs:
      version:
        description: Exact v0.3 release version to verify and package without publishing
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  authorize:
    name: Authorize release source
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
    steps:
      - name: Normalize and validate release event
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          case "${GITHUB_EVENT_NAME}" in
            push)
              if [[ "${GITHUB_REF_TYPE}" != 'tag' ]]; then
                echo 'Release push authorization requires a tag ref.' >&2
                exit 1
              fi
              release_version="${GITHUB_REF_NAME#v}"
              ;;
            workflow_dispatch|workflow_call)
              release_version="${INPUT_VERSION}"
              ;;
            *)
              echo "Unsupported release event: ${GITHUB_EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          if [[ ! "${release_version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release version: ${release_version}" >&2
            exit 1
          fi
          echo "release_version=${release_version}" >> "${GITHUB_OUTPUT}"

      - name: Verify signed release tag from approved release line
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
        run: |
          set -euo pipefail

          tag_ref_endpoint="repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}"
          tag_object_type="$(gh api "${tag_ref_endpoint}" --jq '.object.type')"
          if [[ "${tag_object_type}" != 'tag' ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must be an annotated, signed tag." >&2
            exit 1
          fi

          tag_object_sha="$(gh api "${tag_ref_endpoint}" --jq '.object.sha')"
          verification="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" --jq '.verification.verified')"
          verification_reason="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" --jq '.verification.reason')"
          if [[ "${verification}" != 'true' ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not have a verified signature (${verification_reason})." >&2
            exit 1
          fi

          release_branch='main'
          if [[ "${RELEASE_VERSION}" == 0.1.* ]]; then
            release_branch='0.1.x'
          elif [[ "${RELEASE_VERSION}" == 0.2.* ]]; then
            release_branch='0.2.x'
          fi

          tag_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" --jq '.object.sha')"
          branch_commit="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${release_branch}" --jq '.object.sha')"
          comparison="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${tag_commit}...${branch_commit}" --jq '.status')"
          if [[ "${comparison}" != 'ahead' && "${comparison}" != 'identical' ]]; then
            echo "Release tag ${GITHUB_REF_NAME} is not on the approved ${release_branch} release line." >&2
            exit 1
          fi

  quality:
    name: Release metadata gate
    needs: authorize
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.authorize.outputs.release_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up PHP 8.0
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Install locked dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v3
        with:
          composer-options: --prefer-dist --no-progress

      - name: Verify release metadata, Wiki trees, and Wiki evidence
        run: composer release:verify -- "$RELEASE_VERSION"

  runtime-quality:
    name: Supported runtime quality
    needs: authorize
    uses: ./.github/workflows/quality.yml

  compatibility:
    name: Dependency compatibility
    needs: authorize
    uses: ./.github/workflows/compatibility.yml

  dependency-audit:
    name: Dependency vulnerability gate
    needs: authorize
    uses: ./.github/workflows/security.yml

  distribution-preflight:
    name: Matching distribution tags
    needs: authorize
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.0
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Verify signed distribution tags and package manifests
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for package in core cli laravel; do
            repository="ValentinNikolaev/php-upgrade-preflight-${package}"
            endpoint="repos/${repository}/git/ref/tags/${GITHUB_REF_NAME}"
            object_type="$(gh api "${endpoint}" --jq '.object.type')"
            if [[ "${object_type}" != 'tag' ]]; then
              echo "${repository} must publish ${GITHUB_REF_NAME} as an annotated, signed tag." >&2
              exit 1
            fi

            tag_sha="$(gh api "${endpoint}" --jq '.object.sha')"
            verified="$(gh api "repos/${repository}/git/tags/${tag_sha}" --jq '.verification.verified')"
            if [[ "${verified}" != 'true' ]]; then
              echo "${repository} tag ${GITHUB_REF_NAME} does not have a verified signature." >&2
              exit 1
            fi

            expected="${RUNNER_TEMP}/expected-${package}"
            actual="${RUNNER_TEMP}/actual-${package}"
            archive="${RUNNER_TEMP}/distribution-${package}.tar.gz"
            mkdir -p "${expected}" "${actual}"
            cp -R "packages/${package}/." "${expected}/"
            cp LICENSE README.md CHANGELOG.md SECURITY.md "${expected}/"
            cp -R docs "${expected}/docs"

            gh api "repos/${repository}/tarball/${GITHUB_REF_NAME}" > "${archive}"
            tar -xzf "${archive}" --strip-components=1 -C "${actual}"
            php tools/verify-distribution-payload.php "${expected}" "${actual}"
          done

  fresh-clone-audit:
    name: Fresh clone / ${{ matrix.os }}
    needs: authorize
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ needs.authorize.outputs.release_version }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up PHP 8.0
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.0'
          coverage: none
          extensions: zip

      - name: Mask synthetic secret canaries
        run: php tools/mask-secret-canaries.php

      - name: Clone into a clean path
        shell: pwsh
        run: |
          $freshClone = Join-Path $env:RUNNER_TEMP 'fresh clone'
          git clone --no-local $env:GITHUB_WORKSPACE $freshClone
          git -C $freshClone checkout --detach $env:GITHUB_SHA
          "FRESH_CLONE=$freshClone" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Clean install and manifest validation
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:FRESH_CLONE
          composer install --prefer-dist --no-interaction --no-progress
          composer validate:all

      - name: Run deterministic fixture gate
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:FRESH_CLONE
          composer test:fixtures

      - name: Audit read-only analysis with spaced output paths
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:FRESH_CLONE
          $fixture = Join-Path $env:FRESH_CLONE 'tests/fixtures/projects/laravel-7-to-9'
          $reportDirectory = Join-Path $env:RUNNER_TEMP 'release reports'
          New-Item -ItemType Directory -Path $reportDirectory -Force | Out-Null

          function Get-FixtureDigest([string] $Path) {
            $records = Get-ChildItem -LiteralPath $Path -File -Recurse |
              Sort-Object FullName |
              ForEach-Object {
                $relative = [IO.Path]::GetRelativePath($Path, $_.FullName).Replace('\\', '/')
                $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
                "$relative`0$hash"
              }
            $payload = [Text.Encoding]::UTF8.GetBytes(($records -join "`n"))
            [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($payload))
          }

          $before = Get-FixtureDigest $fixture
          $jsonReport = Join-Path $reportDirectory 'laravel 7 to 9.json'
          $markdownReport = Join-Path $reportDirectory 'laravel 7 to 9.md'

          $arguments = @(
            'packages/cli/bin/upgrade-intel',
            'analyze',
            "--path=$fixture",
            '--from-php=7.4',
            '--target=laravel/framework:^9.0',
            '--target-php=8.1',
            '--framework=laravel',
            '--format=json',
            "--output=$jsonReport"
          )
          php @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          php tools/render-markdown-report.php $jsonReport $markdownReport $fixture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $after = Get-FixtureDigest $fixture
          if ($before -ne $after) {
            throw 'The analyzed fixture changed.'
          }

          $json = Get-Content -LiteralPath $jsonReport -Raw | ConvertFrom-Json
          $expectedVersion = $env:RELEASE_VERSION.TrimStart('v')
          if ($json.metadata.tool.version -ne $expectedVersion) {
            throw "Unexpected report tool version: $($json.metadata.tool.version)"
          }
          if ((Get-Item -LiteralPath $markdownReport).Length -eq 0) {
            throw 'The Markdown report is empty.'
          }

          git diff --exit-code -- tests/fixtures/projects/laravel-7-to-9
          $fixtureStatus = git status --porcelain=v1 --untracked-files=all -- tests/fixtures/projects/laravel-7-to-9
          if ($fixtureStatus) {
            throw "The fixture worktree is dirty:`n$fixtureStatus"
          }

  package:
    name: Build release archives
    needs:
      - authorize
      - quality
      - runtime-quality
      - compatibility
      - dependency-audit
      - distribution-preflight
      - fresh-clone-audit
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.authorize.outputs.release_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.0'
          coverage: none
          extensions: zip

      - name: Validate and archive packages
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSER_ROOT_VERSION="${RELEASE_VERSION}"
          mkdir -p build dist
          for package in core cli laravel; do
            staging="build/${package}"
            mkdir -p "${staging}"
            cp -R "packages/${package}/." "${staging}/"
            cp LICENSE README.md CHANGELOG.md SECURITY.md "${staging}/"
            cp -R docs "${staging}/docs"

            composer validate --strict "${staging}/composer.json"
            composer config --working-dir="${staging}" version "${RELEASE_VERSION}"
            composer archive \
              --working-dir="${staging}" \
              --format=zip \
              --dir="${GITHUB_WORKSPACE}/dist" \
              --file="php-upgrade-preflight-${package}-v${RELEASE_VERSION}"
          done
          php tools/release-artifact-metadata.php generate \
            "--version=${RELEASE_VERSION}" \
            --dist=dist \
            "--repository=https://github.com/${GITHUB_REPOSITORY}" \
            "--commit=${GITHUB_SHA}" \
            "--ref=${GITHUB_REF}" \
            --workflow=.github/workflows/release.yml \
            "--run-uri=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          php tools/release-artifact-metadata.php verify \
            "--version=${RELEASE_VERSION}" \
            --dist=dist \
            "--repository=https://github.com/${GITHUB_REPOSITORY}" \
            "--commit=${GITHUB_SHA}" \
            "--ref=${GITHUB_REF}" \
            --workflow=.github/workflows/release.yml \
            "--run-uri=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"

      - name: Scan release archives for synthetic secrets
        run: php tools/verify-secret-leaks.php dist

      - name: Upload release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archives
          path: dist/*
          if-no-files-found: error

  artifact-consumer:
    name: Install and exercise release archives / ${{ matrix.os }}
    needs:
      - authorize
      - package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      RELEASE_VERSION: ${{ needs.authorize.outputs.release_version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.1'
          coverage: none
          extensions: zip, fileinfo

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archives
          path: dist

      - name: Verify archive set, checksums, and secret boundary
        shell: bash
        run: |
          set -euo pipefail
          for package in core cli laravel; do
            test -f "dist/php-upgrade-preflight-${package}-v${RELEASE_VERSION}.zip"
          done
          test -f dist/DEPENDENCY-INVENTORY.json
          test -f dist/ARTIFACT-PROVENANCE.json
          test -f dist/SHA256SUMS
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 3
          test "$(wc -l < dist/SHA256SUMS)" -eq 5
          (cd dist && sha256sum --check --strict SHA256SUMS)
          php tools/release-artifact-metadata.php verify \
            "--version=${RELEASE_VERSION}" \
            --dist=dist \
            "--repository=https://github.com/${GITHUB_REPOSITORY}" \
            "--commit=${GITHUB_SHA}" \
            "--ref=${GITHUB_REF}" \
            --workflow=.github/workflows/release.yml \
            "--run-uri=https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}"
          php tools/verify-secret-leaks.php dist

      - name: Install all archives in clean consumers
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSER_ROOT_VERSION=1.0.0
          # PHP variables are intentionally single-quoted from Bash.
          # shellcheck disable=SC2016
          artifact_repository="$(php -r '
            echo json_encode([
                "type" => "artifact",
                "url" => str_replace("\\", "/", $argv[1]),
                "canonical" => true,
            ], JSON_THROW_ON_ERROR);
          ' "${GITHUB_WORKSPACE}/dist")"

          configure_consumer() {
            local directory="$1"
            local slug="$2"
            mkdir -p "${directory}"
            cd "${directory}"
            composer init \
              --no-interaction \
              --name="php-upgrade-preflight/archive-${slug}" \
              --description='Ephemeral release archive consumer' \
              --license=proprietary
            composer config minimum-stability stable
            composer config prefer-stable true
            composer repo add release "${artifact_repository}"
          }

          assert_archive_source() {
            local directory="$1"
            local package_name="$2"
            local archive_name="$3"
            # PHP variables are intentionally single-quoted from Bash.
            # shellcheck disable=SC2016
            php -r '
              $lock = json_decode(file_get_contents($argv[1] . "/composer.lock"), true, 512, JSON_THROW_ON_ERROR);
              foreach ($lock["packages"] as $package) {
                  if (($package["name"] ?? null) !== $argv[2]) {
                      continue;
                  }
                  $url = str_replace("\\\\", "/", (string) ($package["dist"]["url"] ?? ""));
                  exit(basename($url) === $argv[3] ? 0 : 1);
              }
              exit(1);
            ' "${directory}" "${package_name}" "${archive_name}"
          }

          core_consumer="${RUNNER_TEMP}/core archive consumer"
          configure_consumer "${core_consumer}" core
          composer require \
            --prefer-dist \
            --update-no-dev \
            --no-interaction \
            --no-progress \
            "php-upgrade-preflight/core:${RELEASE_VERSION}"
          composer check-platform-reqs --no-dev
          assert_archive_source \
            "${core_consumer}" \
            php-upgrade-preflight/core \
            "php-upgrade-preflight-core-v${RELEASE_VERSION}.zip"

          cli_consumer="${RUNNER_TEMP}/cli archive consumer"
          configure_consumer "${cli_consumer}" cli
          composer require \
            --prefer-dist \
            --update-no-dev \
            --no-interaction \
            --no-progress \
            "php-upgrade-preflight/cli:${RELEASE_VERSION}" \
            "php-upgrade-preflight/laravel:${RELEASE_VERSION}"
          composer check-platform-reqs --no-dev
          assert_archive_source \
            "${cli_consumer}" \
            php-upgrade-preflight/cli \
            "php-upgrade-preflight-cli-v${RELEASE_VERSION}.zip"
          assert_archive_source \
            "${cli_consumer}" \
            php-upgrade-preflight/laravel \
            "php-upgrade-preflight-laravel-v${RELEASE_VERSION}.zip"
          vendor/bin/upgrade-intel --help
          echo "CLI_CONSUMER=${cli_consumer}" >> "${GITHUB_ENV}"

          laravel_consumer="${RUNNER_TEMP}/laravel archive consumer"
          configure_consumer "${laravel_consumer}" laravel
          cp -R "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/app" .
          cp -R "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/bootstrap" .
          cp -R "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/config" .
          cp -R "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/tests" .
          cp "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/artisan" .
          mkdir -p storage/logs bootstrap/cache
          # PHP variables are intentionally single-quoted from Bash.
          # shellcheck disable=SC2016
          php -r '
            $manifest = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            $fixture = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            if (($manifest["require"] ?? null) === []) {
                unset($manifest["require"]);
            }
            $manifest["autoload"] = $fixture["autoload"];
            $manifest["scripts"] = $fixture["scripts"];
            file_put_contents(
                "composer.json",
                json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . "\n"
            );
          ' "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/composer.json"
          composer require \
            --prefer-dist \
            --update-no-dev \
            --no-interaction \
            --no-progress \
            --no-security-blocking \
            'laravel/framework:^10.0' \
            "php-upgrade-preflight/laravel:${RELEASE_VERSION}"
          composer check-platform-reqs --no-dev
          assert_archive_source \
            "${laravel_consumer}" \
            php-upgrade-preflight/laravel \
            "php-upgrade-preflight-laravel-v${RELEASE_VERSION}.zip"
          php tests/smoke.php

      - name: Run an installed JSON analysis and prove target immutability
        shell: bash
        run: |
          set -euo pipefail
          target="${RUNNER_TEMP}/artifact analysis target"
          reports="${RUNNER_TEMP}/artifact analysis reports"
          cp -R "${GITHUB_WORKSPACE}/tests/fixtures/projects/laravel-7-to-9" "${target}"
          mkdir -p "${reports}"

          fixture_digest() {
            (
              cd "$1"
              find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
            ) | sha256sum | cut -d ' ' -f 1
          }

          before="$(fixture_digest "${target}")"
          report="${reports}/release artifact analysis.json"
          log="${reports}/release artifact analysis.log"
          set +e
          "${CLI_CONSUMER}/vendor/bin/upgrade-intel" analyze \
            "--path=${target}" \
            --from-php=7.4 \
            '--target=laravel/framework:^9.0' \
            --target-php=8.1 \
            --framework=laravel \
            --format=json \
            "--output=${report}" \
            >"${log}" 2>&1
          analysis_status=$?
          set -e

          php tools/verify-secret-leaks.php "${log}" "${report}"
          if [[ ${analysis_status} -ne 0 ]]; then
            echo 'Installed release archive analysis failed; captured output was withheld after leak scanning.' >&2
            exit "${analysis_status}"
          fi

          # PHP variables are intentionally single-quoted from Bash.
          # shellcheck disable=SC2016
          php -r '
            $report = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            if (($report["metadata"]["tool"]["version"] ?? null) !== $argv[2]) {
                throw new RuntimeException("Unexpected tool version in archive-installed report.");
            }
            if (($report["metadata"]["schema_version"] ?? null) !== "0.8") {
              throw new RuntimeException("Unexpected schema version in archive-installed report.");
            }
            $frameworks = array_column($report["framework_findings"] ?? [], "framework");
            if (!in_array("laravel", $frameworks, true)) {
                throw new RuntimeException("Archive-installed Laravel adapter did not contribute findings.");
            }
          ' "${report}" "${RELEASE_VERSION}"

          after="$(fixture_digest "${target}")"
          test "${before}" = "${after}"
          echo "Fixture SHA-256 before: ${before}"
          echo "Fixture SHA-256 after:  ${after}"

  published-quick-start:
    name: Published Packagist quick start
    needs:
      - artifact-consumer
      - distribution-preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP 8.3
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip

      - name: Install the published packages and verify the quick start
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          consumer="${RUNNER_TEMP}/published quick start"
          mkdir -p "${consumer}"
          cd "${consumer}"
          composer init --no-interaction --name=php-upgrade-preflight/published-smoke --license=proprietary

          expected_references=()
          for package in core cli laravel; do
            repository="ValentinNikolaev/php-upgrade-preflight-${package}"
            tag_object="$(gh api "repos/${repository}/git/ref/tags/v${version}" --jq '.object.sha')"
            expected_references+=("$(gh api "repos/${repository}/git/tags/${tag_object}" --jq '.object.sha')")
          done

          for attempt in 1 2 3 4 5 6; do
            if composer require \
              --prefer-dist \
              --no-interaction \
              --no-progress \
              "php-upgrade-preflight/cli:${version}" \
              "php-upgrade-preflight/laravel:${version}" &&
              php "${GITHUB_WORKSPACE}/tools/verify-installed-package-references.php" \
                "${version}" \
                composer.lock \
                "${expected_references[@]}"; then
              break
            fi
            rm -rf composer.lock vendor
            composer clear-cache
            if [[ "${attempt}" -eq 6 ]]; then
              echo "Packagist did not expose all v${version} packages at their verified signed-tag references after the synchronization window." >&2
              exit 1
            fi
            sleep 20
          done

          composer show "php-upgrade-preflight/cli" "${version}" --locked
          composer show "php-upgrade-preflight/laravel" "${version}" --locked
          vendor/bin/upgrade-intel --help

          target="${RUNNER_TEMP}/published quick start target"
          cp -R "${GITHUB_WORKSPACE}/tests/fixtures/projects/laravel-7-to-9" "${target}"
          fixture_digest() {
            (
              cd "$1"
              find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
            ) | sha256sum | cut -d ' ' -f 1
          }

          before="$(fixture_digest "${target}")"
          report="${RUNNER_TEMP}/published quick start.json"
          vendor/bin/upgrade-intel analyze \
            "--path=${target}" \
            --from-php=7.4 \
            '--target=laravel/framework:^9.0' \
            --target-php=8.1 \
            --framework=laravel \
            --format=json \
            "--output=${report}"
          # Embedded PHP variables must not be expanded by Bash.
          # shellcheck disable=SC2016
          php -r '
            $report = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            if (($report["metadata"]["tool"]["version"] ?? null) !== $argv[2]
                || ($report["metadata"]["schema_version"] ?? null) !== "0.8") {
                throw new RuntimeException("Published quick start returned unexpected report metadata.");
              }
          ' "${report}" "${version}"

          after="$(fixture_digest "${target}")"
          if [[ "${before}" != "${after}" ]]; then
            echo 'The published quick start modified the analyzed target.' >&2
            exit 1
          fi
          echo "Published fixture SHA-256 before: ${before}"
          echo "Published fixture SHA-256 after:  ${after}"

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - artifact-consumer
      - published-quick-start
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"

          mkdir -p dist
          gh run download "${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name release-archives \
            --dir dist
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 3
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 6
          test -f dist/SHA256SUMS
          test "$(wc -l < dist/SHA256SUMS)" -eq 5
          (cd dist && sha256sum --check --strict SHA256SUMS)

          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/docs/releases/v${version}.md?ref=${GITHUB_REF_NAME}" \
            --jq '.content' \
            | base64 --decode > release-notes.md
          test -s release-notes.md

          if gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_VERSION}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${RELEASE_VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title="PHP Upgrade Preflight ${RELEASE_VERSION}" \
              --notes-file=release-notes.md
          else
            gh release create "${RELEASE_VERSION}" \
              dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title="PHP Upgrade Preflight ${RELEASE_VERSION}" \
              --notes-file=release-notes.md
          fi
