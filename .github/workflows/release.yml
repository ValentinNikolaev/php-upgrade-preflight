name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 0.1.x patch version to verify and package without publishing
        required: true
        default: 0.1.0
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality:
    name: Release metadata gate
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Normalize tag version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: echo "RELEASE_VERSION=${RELEASE_VERSION#v}" >> "${GITHUB_ENV}"

      - name: Verify signed release tag from main
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag_ref_endpoint="repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}"
          tag_object_type="$(gh api "${tag_ref_endpoint}" --jq '.object.type')"
          if [[ "${tag_object_type}" != 'tag' ]]; then
            echo "Release tag ${GITHUB_REF_NAME} must be an annotated, signed tag." >&2
            exit 1
          fi

          tag_object_sha="$(gh api "${tag_ref_endpoint}" --jq '.object.sha')"
          verification="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" --jq '.verification.verified')"
          verification_reason="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}" --jq '.verification.reason')"
          if [[ "${verification}" != 'true' ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not have a verified signature (${verification_reason})." >&2
            exit 1
          fi

          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          tag_commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          if ! git merge-base --is-ancestor "${tag_commit}" refs/remotes/origin/main; then
            echo "Release tag ${GITHUB_REF_NAME} is not on the main branch." >&2
            exit 1
          fi

      - name: Set up PHP 8.0
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.0'
          coverage: none

      - name: Install locked dependencies
        uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # v3
        with:
          composer-options: --prefer-dist --no-progress

      - name: Verify release metadata
        run: php tools/verify-release.php "$RELEASE_VERSION"

  runtime-quality:
    name: Supported runtime quality
    uses: ./.github/workflows/quality.yml

  compatibility:
    name: Dependency compatibility
    uses: ./.github/workflows/compatibility.yml

  fresh-clone-audit:
    name: Fresh clone / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Set up PHP 8.0
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.0'
          coverage: none
          extensions: zip

      - name: Mask synthetic secret canaries
        run: php tools/mask-secret-canaries.php

      - name: Clone into a clean path
        shell: pwsh
        run: |
          $freshClone = Join-Path $env:RUNNER_TEMP 'fresh clone'
          git clone --no-local $env:GITHUB_WORKSPACE $freshClone
          "FRESH_CLONE=$freshClone" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Clean install and manifest validation
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:FRESH_CLONE
          composer install --prefer-dist --no-interaction --no-progress
          composer validate:all

      - name: Audit read-only analysis with spaced output paths
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:FRESH_CLONE
          $fixture = Join-Path $env:FRESH_CLONE 'tests/fixtures/projects/laravel-7-to-9'
          $reportDirectory = Join-Path $env:RUNNER_TEMP 'release reports'
          New-Item -ItemType Directory -Path $reportDirectory -Force | Out-Null

          function Get-FixtureDigest([string] $Path) {
            $records = Get-ChildItem -LiteralPath $Path -File -Recurse |
              Sort-Object FullName |
              ForEach-Object {
                $relative = [IO.Path]::GetRelativePath($Path, $_.FullName).Replace('\\', '/')
                $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
                "$relative`0$hash"
              }
            $payload = [Text.Encoding]::UTF8.GetBytes(($records -join "`n"))
            [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData($payload))
          }

          $before = Get-FixtureDigest $fixture
          $jsonReport = Join-Path $reportDirectory 'laravel 7 to 9.json'
          $markdownReport = Join-Path $reportDirectory 'laravel 7 to 9.md'

          $arguments = @(
            'packages/cli/bin/upgrade-intel',
            'analyze',
            "--path=$fixture",
            '--from-php=7.4',
            '--target=laravel/framework:^9.0',
            '--target-php=8.1',
            '--framework=laravel',
            '--format=json',
            "--output=$jsonReport"
          )
          php @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          php tools/render-markdown-report.php $jsonReport $markdownReport
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $after = Get-FixtureDigest $fixture
          if ($before -ne $after) {
            throw 'The analyzed fixture changed.'
          }

          $json = Get-Content -LiteralPath $jsonReport -Raw | ConvertFrom-Json
          $expectedVersion = $env:RELEASE_VERSION.TrimStart('v')
          if ($json.metadata.tool.version -ne $expectedVersion) {
            throw "Unexpected report tool version: $($json.metadata.tool.version)"
          }
          if ((Get-Item -LiteralPath $markdownReport).Length -eq 0) {
            throw 'The Markdown report is empty.'
          }

          git diff --exit-code -- tests/fixtures/projects/laravel-7-to-9
          $fixtureStatus = git status --porcelain=v1 --untracked-files=all -- tests/fixtures/projects/laravel-7-to-9
          if ($fixtureStatus) {
            throw "The fixture worktree is dirty:`n$fixtureStatus"
          }

  package:
    name: Build release archives
    needs:
      - quality
      - runtime-quality
      - compatibility
      - fresh-clone-audit
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Normalize tag version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: echo "RELEASE_VERSION=${RELEASE_VERSION#v}" >> "${GITHUB_ENV}"

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.0'
          coverage: none
          extensions: zip

      - name: Validate and archive packages
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSER_ROOT_VERSION="${RELEASE_VERSION}"
          mkdir -p build dist
          for package in core cli laravel; do
            staging="build/${package}"
            mkdir -p "${staging}"
            cp -R "packages/${package}/." "${staging}/"
            cp LICENSE README.md CHANGELOG.md SECURITY.md "${staging}/"
            cp -R docs "${staging}/docs"

            composer validate --strict "${staging}/composer.json"
            composer config --working-dir="${staging}" version "${RELEASE_VERSION}"
            composer archive \
              --working-dir="${staging}" \
              --format=zip \
              --dir="${GITHUB_WORKSPACE}/dist" \
              --file="php-upgrade-preflight-${package}-v${RELEASE_VERSION}"
          done
          cd dist
          sha256sum ./*.zip > SHA256SUMS

      - name: Scan release archives for synthetic secrets
        run: php tools/verify-secret-leaks.php dist

      - name: Upload release archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-archives
          path: dist/*
          if-no-files-found: error

  artifact-consumer:
    name: Install and exercise release archives
    needs:
      - package
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Normalize tag version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: echo "RELEASE_VERSION=${RELEASE_VERSION#v}" >> "${GITHUB_ENV}"

      - name: Set up PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.1'
          coverage: none
          extensions: zip

      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-archives
          path: dist

      - name: Verify archive set, checksums, and secret boundary
        shell: bash
        run: |
          set -euo pipefail
          for package in core cli laravel; do
            test -f "dist/php-upgrade-preflight-${package}-v${RELEASE_VERSION}.zip"
          done
          test -f dist/SHA256SUMS
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 3
          test "$(wc -l < dist/SHA256SUMS)" -eq 3
          (cd dist && sha256sum --check --strict SHA256SUMS)
          php tools/verify-secret-leaks.php dist

      - name: Install all archives in clean consumers
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSER_ROOT_VERSION=1.0.0
          artifact_repository="{\"type\":\"artifact\",\"url\":\"${GITHUB_WORKSPACE}/dist\",\"canonical\":true}"

          configure_consumer() {
            local directory="$1"
            local slug="$2"
            mkdir -p "${directory}"
            cd "${directory}"
            composer init \
              --no-interaction \
              --name="php-upgrade-preflight/archive-${slug}" \
              --description='Ephemeral release archive consumer' \
              --license=proprietary
            composer config minimum-stability stable
            composer config prefer-stable true
            composer repo add release "${artifact_repository}"
          }

          assert_archive_source() {
            local directory="$1"
            local package_name="$2"
            local archive_name="$3"
            # PHP variables are intentionally single-quoted from Bash.
            # shellcheck disable=SC2016
            php -r '
              $lock = json_decode(file_get_contents($argv[1] . "/composer.lock"), true, 512, JSON_THROW_ON_ERROR);
              foreach ($lock["packages"] as $package) {
                  if (($package["name"] ?? null) !== $argv[2]) {
                      continue;
                  }
                  $url = str_replace("\\\\", "/", (string) ($package["dist"]["url"] ?? ""));
                  exit(basename($url) === $argv[3] ? 0 : 1);
              }
              exit(1);
            ' "${directory}" "${package_name}" "${archive_name}"
          }

          core_consumer="${RUNNER_TEMP}/core archive consumer"
          configure_consumer "${core_consumer}" core
          composer require \
            --prefer-dist \
            --update-no-dev \
            --no-interaction \
            --no-progress \
            "php-upgrade-preflight/core:${RELEASE_VERSION}"
          composer check-platform-reqs --no-dev
          assert_archive_source \
            "${core_consumer}" \
            php-upgrade-preflight/core \
            "php-upgrade-preflight-core-v${RELEASE_VERSION}.zip"

          cli_consumer="${RUNNER_TEMP}/cli archive consumer"
          configure_consumer "${cli_consumer}" cli
          composer require \
            --prefer-dist \
            --update-no-dev \
            --no-interaction \
            --no-progress \
            "php-upgrade-preflight/cli:${RELEASE_VERSION}"
          composer check-platform-reqs --no-dev
          assert_archive_source \
            "${cli_consumer}" \
            php-upgrade-preflight/cli \
            "php-upgrade-preflight-cli-v${RELEASE_VERSION}.zip"
          vendor/bin/upgrade-intel --help
          echo "CLI_CONSUMER=${cli_consumer}" >> "${GITHUB_ENV}"

          laravel_consumer="${RUNNER_TEMP}/laravel archive consumer"
          configure_consumer "${laravel_consumer}" laravel
          cp -R "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/app" .
          cp -R "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/bootstrap" .
          cp -R "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/config" .
          cp -R "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/tests" .
          cp "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/artisan" .
          mkdir -p storage/logs bootstrap/cache
          # PHP variables are intentionally single-quoted from Bash.
          # shellcheck disable=SC2016
          php -r '
            $manifest = json_decode(file_get_contents("composer.json"), true, 512, JSON_THROW_ON_ERROR);
            $fixture = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            if (($manifest["require"] ?? null) === []) {
                unset($manifest["require"]);
            }
            $manifest["autoload"] = $fixture["autoload"];
            $manifest["scripts"] = $fixture["scripts"];
            file_put_contents(
                "composer.json",
                json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . "\n"
            );
          ' "${GITHUB_WORKSPACE}/tests/fixtures/laravel-app/composer.json"
          composer require \
            --prefer-dist \
            --update-no-dev \
            --no-interaction \
            --no-progress \
            --no-security-blocking \
            'laravel/framework:^10.0' \
            "php-upgrade-preflight/laravel:${RELEASE_VERSION}"
          composer check-platform-reqs --no-dev
          assert_archive_source \
            "${laravel_consumer}" \
            php-upgrade-preflight/laravel \
            "php-upgrade-preflight-laravel-v${RELEASE_VERSION}.zip"
          php tests/smoke.php

      - name: Run an installed JSON analysis and prove target immutability
        shell: bash
        run: |
          set -euo pipefail
          target="${RUNNER_TEMP}/artifact analysis target"
          reports="${RUNNER_TEMP}/artifact analysis reports"
          cp -R "${GITHUB_WORKSPACE}/tests/fixtures/projects/laravel-7-to-9" "${target}"
          mkdir -p "${reports}"

          fixture_digest() {
            (
              cd "$1"
              find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
            ) | sha256sum | cut -d ' ' -f 1
          }

          before="$(fixture_digest "${target}")"
          report="${reports}/release artifact analysis.json"
          log="${reports}/release artifact analysis.log"
          set +e
          "${CLI_CONSUMER}/vendor/bin/upgrade-intel" analyze \
            "--path=${target}" \
            --from-php=7.4 \
            '--target=laravel/framework:^9.0' \
            --target-php=8.1 \
            --format=json \
            "--output=${report}" \
            >"${log}" 2>&1
          analysis_status=$?
          set -e

          php tools/verify-secret-leaks.php "${log}" "${report}"
          if [[ ${analysis_status} -ne 0 ]]; then
            echo 'Installed release archive analysis failed; captured output was withheld after leak scanning.' >&2
            exit "${analysis_status}"
          fi

          # PHP variables are intentionally single-quoted from Bash.
          # shellcheck disable=SC2016
          php -r '
            $report = json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);
            if (($report["metadata"]["tool"]["version"] ?? null) !== $argv[2]) {
                throw new RuntimeException("Unexpected tool version in archive-installed report.");
            }
            if (($report["metadata"]["schema_version"] ?? null) !== "0.6") {
                throw new RuntimeException("Unexpected schema version in archive-installed report.");
            }
          ' "${report}" "${RELEASE_VERSION}"

          after="$(fixture_digest "${target}")"
          test "${before}" = "${after}"
          echo "Fixture SHA-256 before: ${before}"
          echo "Fixture SHA-256 after:  ${after}"

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs:
      - artifact-consumer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"

          mkdir -p dist
          gh run download "${GITHUB_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name release-archives \
            --dir dist
          test "$(find dist -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 3
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 4
          test -f dist/SHA256SUMS
          test "$(wc -l < dist/SHA256SUMS)" -eq 3
          (cd dist && sha256sum --check --strict SHA256SUMS)

          gh api \
            "repos/${GITHUB_REPOSITORY}/contents/docs/releases/v${version}.md?ref=${GITHUB_REF_NAME}" \
            --jq '.content' \
            | base64 --decode > release-notes.md
          test -s release-notes.md

          if gh release view "${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_VERSION}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            gh release edit "${RELEASE_VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title="PHP Upgrade Preflight ${RELEASE_VERSION}" \
              --notes-file=release-notes.md
          else
            gh release create "${RELEASE_VERSION}" \
              dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title="PHP Upgrade Preflight ${RELEASE_VERSION}" \
              --notes-file=release-notes.md
          fi
